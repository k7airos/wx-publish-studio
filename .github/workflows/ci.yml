name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Check distributed copy for upstream brand literals
        run: bun run check:brand

      - name: Install the exact CJK font used by the runtime image
        run: |
          set -euo pipefail
          # 封面渲染用的字体字节是合同的一部分：必须与运行镜像里那份**完全一致**。
          # 运行镜像固定的是 Debian 的 fonts-noto-cjk=1:20240730+repack1-1，这里从同一个
          # 基础镜像里取同一份包，既保证字节一致，也不受 ubuntu-latest 字体版本漂移影响。
          # 基础镜像 digest 与 Dockerfile 里的保持一致。
          mkdir -p "$RUNNER_TEMP/font"
          docker run --rm -v "$RUNNER_TEMP/font:/out" \
            oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4 \
            sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends fonts-noto-cjk=1:20240730+repack1-1 && cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc /out/'
          font="$RUNNER_TEMP/font/NotoSansCJK-Regular.ttc"
          expected="b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a"
          actual="$(sha256sum "$font" | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "封面字体字节与合同不符：期望 $expected，实际 $actual" >&2
            exit 1
          fi
          echo "TYPESET_ARTICLE_COVER_FONT_PATH=$font" >> "$GITHUB_ENV"

      - name: Run tests
        run: bun test --max-concurrency=1 tests
        env:
          TEST_DATABASE_URL: postgres://studio:studio@127.0.0.1:5432/studio_test
