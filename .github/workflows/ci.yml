name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Check distributed copy for upstream brand literals
        run: bun run check:brand

      - name: Install CJK font for cover rendering tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          ls -l /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc

      - name: Run tests
        run: bun test --max-concurrency=1 tests
        env:
          TEST_DATABASE_URL: postgres://studio:studio@127.0.0.1:5432/studio_test
          TYPESET_ARTICLE_COVER_FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
