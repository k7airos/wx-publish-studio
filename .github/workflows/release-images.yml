name: Release images

# 打 tag（v*）时构建并发布多架构镜像：
#   - 应用镜像：来自本仓库
#   - Worker 镜像：来自公开仓库 k7airos/zzhub-pipeline 的固定提交
#   - 中转镜像：来自公开仓库 k7airos/bun-wx-server 的固定提交
# 推送到 GHCR（用仓库自带的 GITHUB_TOKEN，无需额外凭据）；
# 若仓库设置了 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 密文，则同时推送到 Docker Hub。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本标签（例如 v0.7.1）"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: k7airos

jobs:
  images:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            image: wx-publish-studio
            version: ""
            repository: ""
            ref: ""
            context: "."
            dockerfile: Dockerfile
          - name: worker
            image: wx-pipeline-worker
            version: "0.24.0"
            repository: k7airos/zzhub-pipeline
            ref: "4cf5725f35758fa5fada8786cb57cd9960388c7f"
            context: sources/worker
            dockerfile: services/cloud-worker/Dockerfile
          - name: relay
            image: wx-relay
            version: "0.2.2"
            repository: k7airos/bun-wx-server
            ref: "3a9864cbb8971ca676259d05f5f937d1f2e842bc"
            context: sources/relay
            dockerfile: Dockerfile
    steps:
      - name: Resolve version
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository || github.repository }}
          ref: ${{ matrix.ref || github.sha }}
          path: ${{ matrix.context }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compose image tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMPONENT_VERSION: ${{ matrix.version }}
          IMAGE: ${{ matrix.image }}
          GHCR: ${{ env.REGISTRY }}/${{ env.OWNER }}
          DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          tags=("$GHCR/$IMAGE:$VERSION" "$GHCR/$IMAGE:latest")
          # 组件自带版本号（Worker / 中转）与发布版本不同时，两个标签都给，避免只跟发布版本而丢组件版本。
          if [ -n "$COMPONENT_VERSION" ] && [ "$COMPONENT_VERSION" != "$VERSION" ]; then
            tags+=("$GHCR/$IMAGE:$COMPONENT_VERSION")
          fi
          if [ -n "$DOCKERHUB" ]; then
            tags+=("$DOCKERHUB/$IMAGE:$VERSION" "$DOCKERHUB/$IMAGE:latest")
            if [ -n "$COMPONENT_VERSION" ] && [ "$COMPONENT_VERSION" != "$VERSION" ]; then
              tags+=("$DOCKERHUB/$IMAGE:$COMPONENT_VERSION")
            fi
          fi
          {
            echo "list<<EOF"
            for tag in "${tags[@]}"; do echo "$tag"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.list }}

  release:
    name: GitHub release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # 给每个版本都附一段「怎么用」，自托管者不必先去翻 README。
          notes="$(mktemp)"
          cat > "$notes" <<'EOF'
          ## 这个版本怎么用

          1. 克隆仓库，按 README「快速开始」第 2 步填好 `.env`（六项必填）。
          2. 起栈：想快就用已发布镜像 `docker compose up -d --wait`；想从源码构建用 `docker compose up -d --build --wait`。
          3. `bash scripts/relay-init.sh` 初始化同栈中转并取回访问令牌。
          4. 打开 `APP_ORIGIN`，用 `BOOTSTRAP_SECRET` 登录，添加公众号，写第一篇并存入草稿箱。

          镜像：`ghcr.io/k7airos/wx-publish-studio`、`wx-pipeline-worker`、`wx-relay`，均为 amd64 + arm64 多架构，公开可拉，不需要镜像仓库账号。

          完整说明见 [README](https://github.com/k7airos/wx-publish-studio#readme) 与 [docs/self-host.md](https://github.com/k7airos/wx-publish-studio/blob/main/docs/self-host.md)。
          EOF
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$notes"
          elif [ -n "$previous" ]; then
            gh release create "$TAG" --title "$TAG" --generate-notes --notes-start-tag "$previous" --notes-file "$notes"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --notes-file "$notes"
          fi
